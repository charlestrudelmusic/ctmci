  <div class="seg" id="sauv"><button data-a="sauver" title="Sauvegarder toutes tes données dans un fichier (⌘S)">⤓<span class="txt"> Sauvegarder</span></button><button data-a="recup" title="Récupérer un fichier de sauvegarde (⌘O)">⤒<span class="txt"> Récupérer</span></button></div>
  <input type="file" id="fichier" accept=".json,application/json" hidden>

<div class="apercu" id="apercu"></div>

<script>
// <calcul> ===== Calcul pur (sans écran) — Annexe I-1, FNEEQ 2023-2028 =====
const CI = {
  IND: 1.8, LABO: 2.0, HC: 1.2, PES1: 0.04, PES2: 0.07, PES_SEUIL: 415,
  facteurAuto(n) { if (n <= 0) return 0; if (n <= 2) return 0.9; if (n === 3) return 1.1; return 1.75; },
  calcule(lignes, o = {}) {
    const r = { princH: 0, compH: 0, indivH: 0, laboH: 0, HP: 0, HC: 0, PES: 0, preps: [], groupes: [], inconnus: [], parEtudiant: 0, ciAutres: 0, autres: [] };
    const vues = new Map();
    for (const l of lignes) {
      if (l.type === 'principal' || l.type === 'complementaire') {
        const h = (Number(l.qte) || 0) * (Number(l.h) || 1);
        r.indivH += h; if (l.type === 'principal') r.princH += h; else r.compH += h;
      } else if (l.type === 'autre') { // coordination, PVRTT, libération… : CI fixe, sans heures
        r.ciAutres += Number(l.ci) || 0; r.autres.push({ nom: l.nom, ci: Number(l.ci) || 0 });
      } else if (l.type === 'labo') {
        r.laboH += (Number(l.qte) || 0) * (Number(l.h) || 1);
      } else if (l.type === 'collectif') {
        const k = l.prep || l.id;
        if (!vues.has(k)) { vues.set(k, Number(l.hp) || 0); r.preps.push({ k, hp: Number(l.hp) || 0, nom: l.nom }); }
        for (const g of l.groupes || []) {
          const h = Number(g.h) || 0; r.HC += h;
          const inc = g.n === null || g.n === '' || g.n === undefined;
          if (inc) { r.inconnus.push(l.nom); r.parEtudiant += h * CI.PES1; }
          else r.PES += Number(g.n) * h;
          r.groupes.push({ nom: l.nom, n: inc ? null : Number(g.n), h });
        }
      }
    }
    r.nPrep = vues.size;
    r.HP = [...vues.values()].reduce((a, b) => a + b, 0);
    r.Fauto = CI.facteurAuto(r.nPrep);
    r.manuel = o.fMode === 'manuel' && o.fManuel !== '' && o.fManuel != null;
    r.F = r.manuel ? Number(o.fManuel) : r.Fauto;
    r.ciInd = CI.IND * r.indivH;
    r.ciLabo = CI.LABO * r.laboH;
    r.ciHP = r.F * r.HP;
    r.ciHC = CI.HC * r.HC;
    r.ciPES = r.PES <= CI.PES_SEUIL ? CI.PES1 * r.PES : CI.PES1 * CI.PES_SEUIL + CI.PES2 * (r.PES - CI.PES_SEUIL);
    r.ci = rond(r.ciInd + r.ciLabo + r.ciHP + r.ciHC + r.ciPES + r.ciAutres);
    r.heures = r.indivH + r.laboH + r.HC;
    r.inconnus = [...new Set(r.inconnus)];
    return r;
  },
  // Combien d'heures de complémentaire faut-il pour atteindre la cible ?
  complementairesRequis(r, cible) {
    const sans = r.ci - CI.IND * r.compH;
    return Math.max(0, Math.ceil((cible - sans) / CI.IND - 1e-9));
  },
};
function rond(x) { return Math.round(x * 100 + 1e-9) / 100; }
// </calcul>

// ===== Programme de musique (catalogue de tous les cours possibles) =====
const C = (id, abbr, code, titre, type, x = {}) => ({ id, abbr, code, titre, type, statut: code ? 'officiel' : 'inconnu',
  discipline: type === 'principal' || type === 'complementaire' ? '25' : '', h: 1, ...x });
// Disciplines (numéro → nom officiel), d'après la liste d'ancienneté (codes 9XX) et l'Entente en musique (35).
const DISC = { '05': 'Clarinette (classique)', '07': 'Contrebasse (classique)', '09': 'Flûte traversière (classique)', '10': 'Guitare (classique)',
  '13': 'Percussion (classique)', '14': 'Piano (classique)', '16': 'Trompette (classique)', '19': 'Violon (classique)', '20': 'Violoncelle (classique)',
  '21': 'Basse électrique (jazz pop)', '22': 'Batterie (jazz pop)', '23': 'Chant (jazz pop)', '24': 'Guitare électrique (jazz pop)', '25': 'Piano (jazz pop)',
  '26': 'Saxophone (jazz pop)', '31': 'Trombone (jazz pop)', '32': 'Trompette (jazz pop) ?', '33': 'Théorie classique', '34': 'Théorie jazz-pop',
  '35': 'Cours complémentaire', '36': 'Accordéon traditionnel', '37': 'Guitare traditionnelle', '38': 'Violon traditionnel', '40': 'Théorie traditionnelle' };
const discNom = d => d ? `${d}${DISC[d] ? ' · ' + DISC[d] : ''}` : '';
const PROGRAMME = () => [
  C('1p2', '1P2', '551-1P2-JO', 'Instrument principal I', 'principal'),
  C('2p2', '2P2', '551-2P2-JO', 'Instrument principal II', 'principal'),
  C('3p2', '3P2', '551-3P2-JO', 'Instrument principal III', 'principal'),
  C('4p2', '4P2', '551-P42-JO', 'Instrument principal IV', 'principal', { statut: 'observe', notes: '« 4P2 » dans l\'offre de la coordo ; 551-P42-JO sur les feuilles A26.' }),
  C('p59', 'P59', '551-P59-JO', 'Instrument principal V', 'principal'),
  C('p69', 'P69', '', 'Instrument principal VI', 'principal', { notes: 'Sigle complet à confirmer (« P69 » dans l\'offre de la coordo).' }),
  C('1c1', '1C1', '551-1C1-JO', 'Instrument complémentaire I', 'complementaire'),
  C('2c1', '2C1', '551-2C1-JO', 'Instrument complémentaire II', 'complementaire'),
  C('3c1', '3C1', '551-3C1-JO', 'Instrument complémentaire III', 'complementaire'),
  C('c41', 'C41', '551-C41-JO', 'Instrument complémentaire IV', 'complementaire', { notes: '551-C41-JO sur la feuille A26 officielle ; « 4C1 » dans l\'offre de la coordo.' }),
  C('c51', 'C51', '551-C51-JO', 'Instrument complémentaire V', 'complementaire'),
  C('c61', 'C61', '', 'Instrument complémentaire VI', 'complementaire', { notes: 'Sigle complet à confirmer (« C61 » dans l\'offre de la coordo).' }),
  C('ensaj', 'ENS AJ', '551-ENS-AJ', 'Ensemble accompagnement jazz-pop', 'collectif', { hp: 1, hg: 1, prep: '551-ENS-AJ', discipline: '25' }),
  C('3lp', '3LP', '551-3LP-JO', 'Théorie musicale III : jazz-pop', 'collectif', { usage: 'Théorie Jazz-Pop I', hp: 2, hg: 2, discipline: '34', notes: '« Langage JP I » sur les feuilles A26. Peut se prendre sans Techno VI (coordo, 29 oct. 2026 : temps plein année).' }),
  C('tech6', 'Techno VI', '', 'Techno VI', 'collectif', { hp: 2, hg: 2, discipline: '34', notes: 'Peut se prendre sans 3LP (coordo, 29 oct. 2026 : temps plein année).' }),
  C('combot', 'Combo tech.', '', 'Combo technique', 'collectif', { hp: 3, hg: 3, statut: 'estime' }),
  C('combo2', 'Combo 2e', '551-ENS-CO', 'Combo 2e année', 'collectif', { hp: 2, hg: 2, statut: 'observe' }),
  C('combo1', 'Combo 1re', '551-E13-CO', 'Combo 1re session', 'collectif', { hp: 1, hg: 1, discipline: '34', statut: 'officiel' }),
  C('labo', 'Labo piano', '551-PIA-JP', 'Laboratoire de piano JP', 'labo', { statut: 'estime' }),

        <div class="legend">${parts.map(([t, x]) => `<span><i style="background:${catCol(t)}"></i>${catNom(t)} <b class="num">${f2(x)}</b></span>`).join('')}</div>

      <div class="hstats"><div><small>CI</small><b class="num">${r.inconnus.length ? '≥ ' : ''}${f2(r.ci)}</b></div>${modeAnnee() ? `<div><small>Année</small><b class="num">${r.inconnus.length ? '≥ ' : ''}${fn(Math.round(ciAnnee(r) / (2 * S.cible) * 100))} %</b></div>` : ''}<div><small>Écart à ${fn(cible)}</small><b class="num" style="color:${ecart >= 0 ? 'var(--ok)' : 'var(--bad)'}">${ecart >= 0 ? '+' : ''}${f2(ecart)}</b></div></div>
    </div>`;
}

// ===== Vue « Blocs d'heures » : une heure (ou un groupe) = un bloc =====
const basculeVue = () => `<div class="seg vseg"><button class="${S.vueBlocs ? '' : 'on'}" data-a="vblocs" data-k="0">☰ Liste</button><button class="${S.vueBlocs ? 'on' : ''}" data-a="vblocs" data-k="1">▦ Blocs d'heures</button></div>`;
function blocs(sc) {
  const pc = ciParCours(sc), r = calc(sc), out = [], parCat = {};
  for (const t of ORDRE) for (const c of S.cours.filter(x => x.type === t && pris(sc, x))) {
    const q = pris(sc, c), coll = t === 'collectif', h = coll ? (c.hg || 1) : (c.h || 1), ciU = pc[c.id].ci / q, n = off(c.id).n;
    parCat[t] = (parCat[t] || 0) + q * h;
    for (let i = 0; i < q; i++) out.push(`<div class="blk ${dernier === c.id && i === q - 1 ? 'neu' : ''}" style="--cat:${CAT[t][1]};--h:${h}" title="${esc(c.abbr)} · ${coll ? `groupe ${i + 1}` : `${unite(c)} ${i + 1}`} · ${fn(h)} h · ${f2(ciU)} CI">
      <b>${esc(c.abbr)}</b><small>${coll ? `gr. ${i + 1} · ${fn(h)} h${n != null ? ` · ${n} ét.` : ''}` : `${fn(h)} h`}</small><em>${pc[c.id].inc ? '≥ ' : ''}${f2(ciU)}</em></div>`);
  }
  return `<div class="blk-l"><b>${fn(r.heures)} h par semaine</b>${ORDRE.filter(t => parCat[t]).map(t => `<span><i style="background:${CAT[t][1]}"></i>${CAT[t][0]} ${fn(parCat[t])} h</span>`).join('')}</div>
    <div class="blocs">${out.join('')}</div>
    <div class="sub" style="margin-top:8px">Chaque bloc = 1 élève ou 1 groupe. Plus large = plus d'heures. Le chiffre = CI rapportée.</div>`;
}

// ===== Lignes de cours : les mêmes dans Scénarios et dans Cours =====
const PRIO = ' <span class="chip" title="Ta priorité : gardée dans tes scénarios de base (ton choix, pas une règle du cégep)">priorité</span>';
const pipsDe = (c, n) => `<div class="pips">${Array.from({ length: maxDe(c) }, (_, i) => `<i class="${i < n ? 'x' : ''}"></i>`).join('')}</div>`;
// Un cours offert : ce qui reste, et un bouton pour l'ajouter au scénario sc
function ligneDispo(c, sc, src, action, label) {
  const o = off(c.id), coll = c.type === 'collectif', n = maxDe(c), pr = pris(sc, c), libres = n - pr;
  const e = libres && sc ? effet(sc, c.id) : null;
  const quoi = coll ? `${pl(n, 'groupe')} de ${fn(c.hg || 1)} h · ${o.n ?? '?'} étud./gr.` : `${pl(n, unite(c))} offert${n > 1 ? 's' : ''}`;
  return `<div class="brow ${libres ? '' : 'fini'}" style="--cat:${CAT[c.type][1]}" ${libres ? `draggable="true" data-drag="${src}:${c.id}"` : ''}>
    <div class="nm"><b>${esc(c.abbr)}</b>${o.ferme ? PRIO : ''}<small>${esc(c.usage || c.titre)} · ${quoi}</small>
      <div class="dispo">${pipsDe(c, pr)}<span>${libres ? `${pl(libres, 'libre')}${pr ? ` · ${pr} pris` : ''}` : 'tout pris'}</span></div></div>
    ${libres ? `<button class="addb" data-a="${action}" data-k="${c.id}"><span>${label}</span>${e ? `<small>${e.inc ? '≥ ' : ''}+${f2(e.d)} CI</small>` : ''}</button>` : '<span class="okc">✓</span>'}
  </div>${e && e.fx ? `<div class="fx">↳ dont ${e.fx > 0 ? '+' : ''}${f2(e.fx)} : le facteur HP passe de ${fn(e.Fav)} à ${fn(e.Fap)} pour tous tes cours de groupe</div>` : ''}`;
}
// Un cours pris dans le scénario sc
function lignePrise(c, sc, pc, src) {
  const o = off(c.id), q = pris(sc, c), v = pc[c.id], coll = c.type === 'collectif';
  return `<div class="brow ${dernier === c.id ? 'neu' : ''}" style="--cat:${CAT[c.type][1]}" draggable="true" data-drag="${src}:${c.id}">
    <div class="nm"><b>${esc(c.abbr)}</b>${o.ferme ? PRIO : ''}<small>${esc(c.usage || c.titre)} · ${coll ? `${pl(q, 'groupe')} × ${fn(c.hg || 1)} h` : pl(q * (c.h || 1), 'heure')}</small>
      ${coll ? `<label class="eff ligne"><input class="inp sm" placeholder="?" value="${o.n ?? ''}" data-ch="oeff" data-k="${c.id}"> étudiants par groupe</label>` : ''}</div>
    ${compteur(c, q, sc.id)}
    <span class="v num">${v.inc ? '≥ ' : ''}${f2(v.ci)}</span>
    <button class="x" data-a="retire" data-s="${sc.id}" data-k="${c.id}" title="Retirer">×</button></div>`;
}

function constructeur(sc) {
  const r = calc(sc), cible = cibleS(), ecart = r.ci - cible;
  const offreC = offerts().filter(c => c.type === 'complementaire').reduce((a, c) => a + maxDe(c), 0);
  const req = CI.complementairesRequis(r, cible);
  const avert = [];
  if (r.inconnus.length) avert.push(`<div class="note warn">◔ <div>Nombre d'étudiants inconnu : <b>${r.inconnus.join(', ')}</b>. Le % est un <b>minimum</b>. Tape le nombre dans la tuile pour voir.</div></div>`);
  if (r.manuel && Math.abs(r.F - r.Fauto) > 1e-9) avert.push(`<div class="note warn">⚑ <div>Facteur HP ajusté à la main : <b>${fn(r.F)}</b> au lieu de ${fn(r.Fauto)}.</div></div>`);
  if (ecart < 0) avert.push(req > offreC
    ? `<div class="note bad">✕ <div>Même avec tous les complémentaires offerts, il manquerait ${pl(req - offreC, 'heure')} pour atteindre la cible.</div></div>`
    : `<div class="note">→ <div>Il te manque <b>${f2(-ecart)} CI</b> : environ <b>${pl(Math.max(0, req - r.compH), 'complémentaire')}</b> de plus.</div></div>`);
  const gauche = ORDRE.map(t => { const l = offerts().filter(c => c.type === t); return l.length ? `<h3>${CAT[t][0]}</h3>${l.map(c => ligneDispo(c, sc, 'off', 'ajoute', '+ Ajouter')).join('')}` : ''; }).join('');
  const pc = ciParCours(sc), dans = S.cours.filter(c => pris(sc, c));
  const sect = t => {
    const l = dans.filter(c => c.type === t); if (!l.length) return '';
    const tot = l.reduce((a, c) => a + pc[c.id].ci, 0);
    return `<h3 style="display:flex"><span style="flex:1">${CAT[t][0]}</span><span class="num">${f2(tot)} CI</span></h3>${l.map(c => lignePrise(c, sc, pc, 'tache')).join('')}`
      + (t === 'collectif' ? `<div class="fline"><span>Facteur HP <b>${fn(r.F)}</b> · calculé tout seul : ${pl(r.nPrep, 'cours de groupe différent')}${r.nPrep > 1 ? '' : ''}</span>
        ${sc.fMode === 'manuel' || S.ajusterF ? `<select class="inp" style="width:auto" data-ch="fmode" data-s="${sc.id}"><option value="auto" ${sc.fMode !== 'manuel' ? 'selected' : ''}>Auto</option><option value="manuel" ${sc.fMode === 'manuel' ? 'selected' : ''}>Manuel</option></select>
        ${sc.fMode === 'manuel' ? `<input class="inp sm" value="${esc(sc.fManuel)}" placeholder="0,9" data-ch="fman" data-s="${sc.id}">` : ''}` : '<button class="lnk" data-a="ajusterF">ajuster</button>'}</div>` : '');
  };
  return `<section class="card hero" ${cc('sc-' + sc.id)}>${dot('sc-' + sc.id)}
    <div style="display:flex;gap:10px;align-items:center;padding-right:18px"><span class="chip" style="font-weight:700">Scénario ${noSc(sc)}</span><input class="ttl-in" value="${esc(sc.nom)}" data-ch="scnom" data-s="${sc.id}" placeholder="Nom du scénario" title="Clique pour renommer">
      <div class="hacts">${ses().retenu === sc.id ? `<button class="choix gros" data-a="retenir" data-s="${sc.id}" title="Cliquer pour annuler ce choix">✓ Mon choix</button>` : `<button class="hb" data-a="retenir" data-s="${sc.id}">Choisir ce scénario</button>`}
        <button class="hb" data-a="dup" data-s="${sc.id}">⧉ Dupliquer</button>${scs().length > 1 ? `<button class="hb del" data-a="del" data-s="${sc.id}">Supprimer</button>` : ''}</div></div>
    <div class="garde">${autresAnnee().length ? `<div class="seg vseg" style="margin:0" title="Le temps plein se calcule sur l'année : 80 CI pour automne + hiver"><button class="${S.cibleMode !== 'session' ? 'on' : ''}" data-a="cmode" data-k="annee">Viser l'année</button><button class="${S.cibleMode === 'session' ? 'on' : ''}" data-a="cmode" data-k="session">Viser la session</button></div>` : ''}
      <label title="Si tu fais scinder ta tâche (autre cégep) : le % que tu gardes ici">Tâche gardée ici <input class="inp sm" value="${fn(garde())}" data-ch="garde"> %</label>
      <span class="sub">${modeAnnee() ? `Année ${esc(ses().annee)} : ${autresAnnee().map(x => `${esc(x.nom)} ${x.ci == null ? '(pas encore choisie)' : f2(x.ci)}`).join(' + ')} → il te faut <b>${f2(cibleS())} CI</b> cette session pour ${fn(garde())} % sur l'année` : garde() < 100 ? `soit ${f2(cibleS())} CI · le reste (${f2(S.cible - cibleS())} CI) irait à quelqu'un d'autre` : `cible : ${f2(cibleS())} CI cette session`}</span></div>
    ${jauge(r)}
    ${avert.join('')}
  </section>
  <div class="builder">
    <section class="card zone-offre" ${cc('offre')} data-zone="offsc" data-keep="offsc">${dot('offre')}
      <h2>➕ Ajouter des cours</h2><div class="sub">Ce qu'on t'offre en ${esc(ses().nom)}. Clique « + Ajouter » ou glisse la carte à droite.</div>
      ${gauche}
      <button class="lnk" data-a="tab" data-k="cours" style="margin-top:12px">Modifier ce qui m'est offert →</button>
    </section>
    <section class="card zone-tache" ${cc('tache')} data-zone="tache">${dot('tache')}
      <h2>Dans ce scénario</h2><div class="sub">− / + pour le nombre d'élèves ou de groupes · × pour retirer (ou glisse la tuile à gauche).</div>
      ${dans.length ? basculeVue() + (S.vueBlocs ? blocs(sc) : ORDRE.map(sect).join('')) : '<div class="vide-z">Ce scénario est vide.<br>Ajoute des cours à partir de la colonne de gauche.</div>'}
      ${sectionAutres(sc)}
    </section>
  </div>`;
}

const AUT_COL = '#a78bfa';
const partsDe = r => [['principal', CI.IND * r.princH], ['complementaire', CI.IND * r.compH], ['collectif', r.ciHP + r.ciHC + r.ciPES], ['labo', r.ciLabo], ['autre', r.ciAutres]].filter(p => p[1] > 0);
const catCol = t => t === 'autre' ? AUT_COL : CAT[t][1];
const catNom = t => t === 'autre' ? 'Autres éléments' : CAT[t][0];
// Autres éléments de tâche (CI fixe, sans heures)
const SUGG_AUT = ['Libération', 'PVRTT', 'Coordination départementale', 'Coordination de programme', 'Reclassement combo'];
// Valeur en CI d'un élément : saisi en CI, ou en % de tâche (1 % = 0,4 CI pour une session de 40)
const ciAut = a => a.unite === 'pct' ? rond((Number(a.pct) || 0) * S.cible / 100) : (Number(a.ci) || 0);
function sectionAutres(sc) {
  const l = sc.autres || [], tot = l.reduce((a, x) => a + ciAut(x), 0);
  const libPct = l.filter(x => x.unite === 'pct').reduce((a, x) => a + (Number(x.pct) || 0), 0);
  return `<h3 style="display:flex"><span style="flex:1">Autres éléments · coordination, libération, PVRTT…</span>${l.length ? `<span class="num">${f2(tot)} CI</span>` : ''}</h3>
    ${l.map((a, i) => { const pct = a.unite === 'pct', v = pct ? a.pct : a.ci;
      return `<div class="brow aut" style="--cat:${AUT_COL}">
      <input class="inp" list="aut-l" value="${esc(a.lib)}" placeholder="Ex. Libération" data-ch="autlib" data-s="${sc.id}" data-i="${i}">
      <input class="inp sm" value="${v === '' || v == null ? '' : fn(v)}" placeholder="0" data-ch="autval" data-s="${sc.id}" data-i="${i}">
      <div class="seg vseg" style="margin:0"><button class="${pct ? '' : 'on'}" data-a="autu" data-s="${sc.id}" data-i="${i}" data-k="ci">CI</button><button class="${pct ? 'on' : ''}" data-a="autu" data-s="${sc.id}" data-i="${i}" data-k="pct">%</button></div>
      <span class="conv">${pct ? `= ${f2(ciAut(a))} CI` : `= ${fn(Math.round(ciAut(a) / S.cible * 1000) / 10)} %`}</span>
      <button class="x" data-a="autdel" data-s="${sc.id}" data-i="${i}" title="Retirer">×</button></div>`; }).join('')}
    <datalist id="aut-l">${SUGG_AUT.map(x => `<option value="${x}">`).join('')}</datalist>
    <div class="autadd"><button class="tagb" data-a="autadd" data-s="${sc.id}" data-k="Libération" data-u="pct">+ Libération (%)</button><button class="tagb" data-a="autadd" data-s="${sc.id}" data-k="PVRTT" data-u="pct">+ PVRTT (%)</button><button class="tagb" data-a="autadd" data-s="${sc.id}" data-k="Coordination départementale" data-u="ci">+ Coordination (CI)</button><button class="tagb" data-a="autadd" data-s="${sc.id}" data-k="" data-u="ci">+ Autre</button></div>
    ${libPct > 60 ? `<div class="note warn">⚑ <div>Libérations : <b>${fn(libPct)} %</b> de tâche. Le maximum est <b>60 %</b> sur l'année (charge d'au moins 0,4 ETC, convention art. 5-14.01) ; pour une seule session, la charge est d'au plus 80 %.</div></div>` : ''}
    <div class="hint">S'ajoute à ta tâche sans heures devant étudiants. En % : 20 % = 8 CI (sur une session de 40 CI).</div>`;
}

// Le % de tâche et les heures par semaine, côte à côte, même grosseur
function duo(r, cls = '') {
  const inc = r.inconnus.length ? '≥' : '';
  return `<div class="duo ${cls}"><div><b class="num">${inc}${fn(Math.round(r.ci / S.cible * 100))}</b><span>%</span><small>de tâche</small></div>
    <div><b class="num">${fn(r.heures)}</b><span>h</span><small>par semaine</small></div></div>`;
}
function barre(r, max) {
  const parts = partsDe(r);
  const w = x => (x / max * 100).toFixed(2) + '%';
  return `<div class="hbar sm">${parts.map(([t, x]) => `<i class="seg" style="width:${w(x)};background:${catCol(t)}"></i>`).join('')}<span class="mark" style="left:${w(cibleS())}"></span></div>`;
}
function vueComparer() {
  const L = scs().map(sc => ({ sc, r: calc(sc), pc: ciParCours(sc) }));
  const cible = cibleS(), g = garde(), max = Math.max(cible * 1.2, ...L.map(x => x.r.ci * 1.05));
  const pct = x => `${x.r.inconnus.length ? '≥ ' : ''}${fn(Math.round(x.r.ci / S.cible * 100))} %`;
  const parH = x => x.r.heures ? x.r.ci / x.r.heures : 0;
  const nomx = x => `<b>${noSc(x.sc)} · ${esc(x.sc.nom)}</b>`;
  const atteint = L.filter(x => x.r.ci >= cible - 1e-9);
  const proche = L.reduce((a, b) => b.r.ci > a.r.ci ? b : a);
  const moinsH = atteint.length ? atteint.reduce((a, b) => b.r.heures < a.r.heures ? b : a) : null;
  const rendement = L.reduce((a, b) => parH(b) > parH(a) ? b : a);
  const inc = [...new Set(L.flatMap(x => x.r.inconnus))];
  const bref = [
    atteint.length ? `✓ ${atteint.length > 1 ? 'Atteignent' : 'Atteint'} la cible (${f2(cible)} CI${modeAnnee() ? ', année' : ''}) : ${atteint.map(nomx).join(', ')}` : `✕ Aucun scénario n'atteint la cible (${f2(cible)} CI). Le plus proche : ${nomx(proche)} (${pct(proche)}).`,
    moinsH && atteint.length > 1 ? `⏱ Le moins d'heures pour y arriver : ${nomx(moinsH)} — ${fn(moinsH.r.heures)} h par semaine.` : '',
    `↗ Chaque heure rapporte le plus dans ${nomx(rendement)} : ${f2(parH(rendement))} CI par heure.`,
    inc.length ? `◔ Les « ≥ » vont monter selon le nombre d'étudiants en ${inc.join(', ')}.` : '',
  ].filter(Boolean);
  const cartes = L.map(x => { const ret = ses().retenu === x.sc.id, ec = x.r.ci - cible;
    return `<div class="ccard ${ret ? 'ret' : ''}" ${cc('sc-' + x.sc.id)}>
      <div class="ch"><span class="no">${noSc(x.sc)}</span><b>${esc(x.sc.nom)}</b></div>
      ${duo(x.r, 'sm')}
      ${barre(x.r, max)}
      <div class="cl">${x.r.inconnus.length ? '≥ ' : ''}${f2(x.r.ci)} CI · ${f2(parH(x))} CI par heure</div>
      <div class="cl" style="color:${ec >= 0 ? 'var(--ok)' : 'var(--bad)'}">${ec >= 0 ? `✓ cible atteinte (+${f2(ec)})` : `il manque ${f2(-ec)} CI`}</div>
      <div class="cb">${ret ? `<button class="choix gros" data-a="retenir" data-s="${x.sc.id}">✓ Mon choix</button>` : `<button class="hb" data-a="retenir" data-s="${x.sc.id}">Choisir celui-ci</button>`}<button class="lnk" data-a="voir" data-k="${x.sc.id}">Ouvrir →</button></div>
    </div>`; }).join('');
  const utilises = S.cours.filter(c => L.some(x => x.pc[c.id]));
  let lignes = '';
  for (const t of ORDRE) {
    const cs = utilises.filter(c => c.type === t); if (!cs.length) continue;
    lignes += `<tr class="sec"><td colspan="${L.length + 1}">${CAT[t][0]}</td></tr>`;
    lignes += cs.map(c => { const vals = L.map(x => x.pc[c.id] ? x.pc[c.id].h + ':' + x.pc[c.id].ci : '-'), diff = new Set(vals).size > 1;
      return `<tr class="${diff ? 'diff' : 'same'}"><td><b>${esc(c.abbr)}</b> <span class="sub">${esc(c.usage || c.titre)}</span></td>${L.map(x => { const v = x.pc[c.id]; return `<td class="r">${v ? `${fn(v.h)} h · <b>${v.inc ? '≥ ' : ''}${f2(v.ci)}</b>` : '<span class="sub">—</span>'}</td>`; }).join('')}</tr>`; }).join('');
  }
  return `<section class="card" ${cc('comp')}>${dot('comp')}
    <h2>Comparer les scénarios — ${esc(ses().nom)}</h2>
    <ul class="bref">${bref.map(x => `<li>${x}</li>`).join('')}</ul>
    <div class="cgrid">${cartes}</div>
    <h3 style="margin-top:22px">Ce qui change d'un scénario à l'autre</h3><div class="sub">En clair : les cours qui diffèrent. En pâle : identiques partout.</div>
    <div style="overflow-x:auto;margin-top:8px"><table class="cmp">
    <thead><tr><th></th>${L.map(x => `<th class="r" ${cc('sc-' + x.sc.id)}><span class="no">${noSc(x.sc)}</span> ${esc(x.sc.nom)}</th>`).join('')}</tr></thead>
    <tbody>${lignes}
      ${L.some(x => x.r.ciAutres) ? (() => { const v = L.map(x => f2(x.r.ciAutres)); return `<tr class="${new Set(v).size > 1 ? 'diff' : 'same'}"><td><b>Autres éléments</b> <span class="sub">coordination, PVRTT…</span></td>${L.map(x => `<td class="r">${x.r.ciAutres ? `<b>${f2(x.r.ciAutres)}</b>` : '<span class="sub">—</span>'}</td>`).join('')}</tr>`; })() : ''}
      <tr class="tot"><td>Total</td>${L.map(x => `<td class="r">${fn(x.r.heures)} h · ${x.r.inconnus.length ? '≥ ' : ''}${f2(x.r.ci)}</td>`).join('')}</tr>
      <tr><td class="sub">Facteur HP</td>${L.map(x => `<td class="r sub">${fn(x.r.F)} (${pl(x.r.nPrep, 'cours de groupe')})</td>`).join('')}</tr>
    </tbody></table></div>
  </section>`;
}

// ----- Onglet Cours : Programme → Offerts → Je les prends -----
function vueCours() {
  const q = (S.cherche || '').toLowerCase();
  const ok = c => !q || [c.code, c.abbr, c.titre, c.usage].join(' ').toLowerCase().includes(q);
  const verrou = !!ses().verrou;
  const prog = S.cours.filter(c => !off(c.id) && ok(c));
  const info = c => `<button class="info" data-a="edit" data-k="${c.id}" title="Fiche du cours">i</button>`;
  const ligneProg = c => `<div class="brow" style="--cat:${CAT[c.type][1]}" draggable="true" data-drag="prog:${c.id}" title="Glisse vers Offerts">
      <div class="nm"><b>${esc(c.abbr)}</b> ${c.statut !== 'officiel' ? badge(c.statut) : ''}<small>${esc(c.titre)}${c.code ? ' · ' + esc(c.code) : ''}${c.discipline ? ' · disc. ' + esc(discNom(c.discipline)) : ''}</small></div>
      ${info(c)}${verrou ? '' : `<button class="mini" data-a="offrir" data-k="${c.id}">Offert →</button>`}</div>`;
  const ligneOffre = c => {
    const o = off(c.id), coll = c.type === 'collectif', n = maxDe(c);
    const quoi = coll ? `${pl(n, 'groupe')} de ${fn(c.hg || 1)} h · ${o.n ?? '?'} étudiants par groupe` : `${pl(n, unite(c))} offert${n > 1 ? 's' : ''}`;
    if (verrou) return `<div class="brow fixe" style="--cat:${CAT[c.type][1]}"><div class="nm"><b>${esc(c.abbr)}</b>${o.ferme ? PRIO : ''}<small>${esc(c.usage || c.titre)}${c.code ? ' · ' + esc(c.code) : ''}</small></div><span class="qte">${quoi}</span>${info(c)}</div>`;
    return `<div class="brow edit" style="--cat:${CAT[c.type][1]}" draggable="true" data-drag="offre:${c.id}">
      <div class="nm"><b>${esc(c.abbr)}</b><small>${esc(c.usage || c.titre)}</small>
        <div class="orow"><div class="step"><button data-a="om" data-k="${c.id}" ${n <= 1 ? 'disabled' : ''}>−</button><span><input class="num-in" value="${n}" data-ch="onum" data-k="${c.id}" title="Tape un nombre"></span><button data-a="op" data-k="${c.id}">+</button></div><span class="sub">${coll ? `groupe${n > 1 ? 's' : ''}` : `${unite(c)}${n > 1 ? 's' : ''}`}</span>
        ${coll ? `<label class="eff"><input class="inp sm" placeholder="?" value="${o.n ?? ''}" data-ch="oeff" data-k="${c.id}"> étud./gr.</label>` : ''}
        <button class="tagb ${o.ferme ? 'on' : ''}" data-a="ferme" data-k="${c.id}" title="Ta priorité : gardée dans tes scénarios de base (ton choix, pas une règle)">priorité</button></div></div>
      ${info(c)}<button class="x" data-a="desoffrir" data-k="${c.id}" title="Pas offert finalement">×</button></div>`;
  };
  const parType = (l, f) => ORDRE.map(t => { const x = l.filter(c => c.type === t); return x.length ? `<h3>${CAT[t][0]}</h3>${x.map(f).join('')}` : ''; }).join('');
  return `<div class="board deux ${S.progReplie ? 'pr' : ''}">
    ${S.progReplie ? `<section class="card replie" data-a="progr" title="Ouvrir le programme"><span class="cn">1</span><span class="vtxt">Programme ›</span></section>` : `<section class="card" ${cc('col-prog')} data-zone="prog">${dot('col-prog')}
      <div class="colh"><span class="cn">1</span><div style="flex:1"><h2>Programme</h2><div class="sub">Tous les cours possibles</div></div><button class="hb" data-a="progr" title="Replier le programme">‹ Replier</button></div>
      <div style="display:flex;gap:8px;margin:12px 0 4px"><input class="inp" placeholder="Chercher…" value="${esc(S.cherche || '')}" data-ch="cherche"><button class="btn" data-a="nouveau">+ Cours</button></div>
      ${verrou ? '<div class="hint">🔒 L\'offre est verrouillée. Clique la pastille « Verrouillée » pour y ajouter un cours.</div>' : ''}
      ${prog.length ? parType(prog, ligneProg) : `<div class="vide-z" style="height:120px">${q ? 'Rien trouvé.' : 'Tous les cours sont offerts.'}</div>`}
    </section>`}
    <section class="card ${verrou ? 'verrouille' : ''}" ${cc('col-offre')} data-zone="offre">${dot('col-offre')}
      <div class="colh"><span class="cn">2</span><div style="flex:1"><h2>Offerts</h2><div class="sub">Possibilité de choix de cours pour ${esc(ses().nom)}.</div></div>
        <button class="verrou ${verrou ? 'ferme' : ''}" data-a="verrou" title="${verrou ? 'Cliquer pour modifier l\'offre' : 'Cliquer pour verrouiller l\'offre'}">${verrou ? '🔒 Verrouillée' : '🔓 Déverrouillée'}</button></div>
      ${offerts().length ? parType(offerts(), ligneOffre) : '<div class="vide-z" style="height:160px">Glisse ici les cours qu\'on t\'offre<br>(ou « Offert → »)</div>'}
      ${offerts().length ? `<button class="btn pri" style="margin-top:16px;width:100%" data-a="tab" data-k="sc">Faire mes scénarios avec cette offre →</button>` : ''}
    </section>
  </div>`;
}

function etapes(r, sc) {
  const S_ = [];
  const st = (t, f, v, cls = '') => S_.push(`<div class="st ${cls}"><div class="n">${S_.length + 1}</div><div><div class="t">${t}</div><div class="f">${f}</div></div><div class="v">${v}</div></div>`);
  st('Instruments individuels', `<span class="mono">${r.princH} h principal + ${r.compH} h complémentaire = ${r.indivH} h × 1,8</span><br><small>Valeur fixe prévue pour la musique. Ne compte pas dans les préparations.</small>`, f2(r.ciInd));
  if (r.laboH) st('Laboratoire', `<span class="mono">${r.laboH} h × 2,0</span>`, f2(r.ciLabo));
  const F = [[1, '1–2 : 0,9'], [3, '3 : 1,1'], [4, '4+ : 1,75']];
  const fOn = n => n <= 2 ? 1 : n === 3 ? 3 : 4;
  st('Préparations distinctes → facteur HP', `${r.preps.length ? r.preps.map(p => `<span class="chip">${esc(p.nom)}</span>`).join(' ') : 'Aucun cours de groupe'} = <b>${r.nPrep}</b><br>
    <div class="ftab">${F.map(([n, t]) => `<span class="${r.nPrep && fOn(r.nPrep) === n ? 'on' : ''}">${t}</span>`).join('')}</div>
    ${r.manuel ? `<br><small>⚑ Remplacé manuellement par <b>${fn(r.F)}</b>${sc.fRaison ? ' — ' + esc(sc.fRaison) : ''}</small>` : ''}`, 'F = ' + fn(r.F));
  st('HP — heures de préparation', `<span class="mono">(${r.preps.map(p => fn(p.hp)).join(' + ') || '0'}) h × ${fn(r.F)}</span><br><small>Un même cours donné à plusieurs groupes = une seule préparation.</small>`, f2(r.ciHP));
  st('HC — heures en classe', `<span class="mono">${r.groupes.map(g => fn(g.h)).join(' + ') || '0'} = ${fn(r.HC)} h × 1,2</span>`, f2(r.ciHC));
  st('PES — périodes-étudiants', `<span class="mono">${r.groupes.map(g => `${g.n == null ? '?' : g.n}×${fn(g.h)}`).join(' + ') || '0'} = ${fn(r.PES)} × 0,04</span>${r.inconnus.length ? `<br><small>? = effectif inconnu, compté 0 pour l'instant.</small>` : ''}${r.PES > 415 ? '<br><small>Au-delà de 415 PES : 0,07.</small>' : ''}`, f2(r.ciPES));
  if (r.ciAutres) st('Autres éléments (CI fixe)', `<span class="mono">${r.autres.map(a => `${esc(a.nom)} ${f2(a.ci)}`).join(' + ')}</span><br><small>Sans heures devant étudiants.</small>`, f2(r.ciAutres));
  st('CI de la session', `<span class="mono">${f2(r.ciInd)}${r.laboH ? ' + ' + f2(r.ciLabo) : ''} + ${f2(r.ciHP)} + ${f2(r.ciHC)} + ${f2(r.ciPES)}${r.ciAutres ? ' + ' + f2(r.ciAutres) : ''}</span>`, (r.inconnus.length ? '≥ ' : '') + f2(r.ci), 'tot');
  st('Pourcentage indicatif', `<span class="mono">${f2(r.ci)} ÷ ${S.cible} × 100</span><br><small>Repère seulement. Le % officiel est celui du contrat.</small>`, fn(Math.round(r.ci / S.cible * 100)) + ' %');
  st('Heures devant étudiants', `<span class="mono">${fn(r.indivH)} h individuelles + ${fn(r.HC)} h de groupe</span><br><small>${f2(r.heures ? r.ci / r.heures : 0)} CI par heure.</small>`, fn(r.heures) + ' h');
  return `<div class="steps">${S_.join('')}</div>`;
}

    <tr><td>Laboratoire lié à l'instrument principal</td><td class="r"><b>2,0</b></td></tr></table>
    <p class="sub">Ces cours ne comptent pas dans le nombre de « cours différents » (le facteur F plus bas).</p>`)}
  ${sec('Cours de groupe : trois morceaux', `<div class="form">CI = F × HP + 1,2 × HC + 0,04 × PES</div>
    <ul><li><b>HP</b> — heures de <b>préparation</b> : comptées <b>une fois par cours différent</b>, même s'il a plusieurs groupes.</li>

  ${sec('Raccourcis', `<table>

    <tr><td><kbd>⌘P</kbd></td><td>Imprimer / PDF</td></tr><tr><td><kbd>⌘S</kbd> / <kbd>⌘O</kbd></td><td>Sauvegarder / récupérer (app)</td></tr></table>
    <p class="sub">Sources : convention collective FNEEQ-CSN 2023-2028 (annexe I-1, art. 5-14), Entente en musique, feuilles A26 du département.</p>`)}
  </div>`;
}

// La feuille elle-même (écran, aperçu et PDF)
function feuilleHTML(ch) {
  const r = calc(ch), pc = ciParCours(ch);
  const ordre = ['complementaire', 'principal', 'labo', 'collectif'];
  const nom = { complementaire: 'Instrument compl.', principal: 'Instrument princ.', labo: 'Instrument labo' };
  const lignes = ordre.flatMap(t => S.cours.filter(c => c.type === t && pris(ch, c)).map(c => {
    const q = pris(ch, c), v = pc[c.id];
    if (t !== 'collectif') return `<tr><td>${nom[t]}</td><td class="r">${esc(c.discipline || '')}</td><td class="mono">${esc(c.code || c.abbr)}</td><td class="r">${fn(v.h)}</td><td class="gris" colspan="4"></td><td class="r"><b>${f2(v.ci)}</b></td></tr>`;
    const n = off(c.id).n, et = n == null ? '?' : n * q, pes = n == null ? '?' : fn(n * q * (c.hg || 1));
    return `<tr class="gr"><td>${esc(c.usage || c.titre)}</td><td class="r">${esc(c.discipline || '')}</td><td class="mono">${esc(c.code || c.abbr)}</td><td class="r">${fn(v.h)}</td><td class="r">${fn(c.hp || 0)}</td><td class="r">${q}</td><td class="r">${et}</td><td class="r">${pes}</td><td class="r"><b>${v.inc ? '≥ ' : ''}${f2(v.ci)}</b></td></tr>`;
  })).join('');
  return `<div class="f-tete"><div><div class="tag">Tâche d'enseignement en musique — ${esc(ses().nom)}</div><h2>${esc(ch.nom)}</h2><div class="sub">Scénario ${noSc(ch)} · mon choix · simulation calculée par l'outil</div></div>${duo(r, 'sm')}</div>
    ${r.inconnus.length ? `<div class="note warn">◔ <div>Nombre d'étudiants inconnu : <b>${r.inconnus.join(', ')}</b>. Les chiffres marqués « ≥ » sont des minimums.</div></div>` : ''}
    <div style="overflow-x:auto;margin-top:12px"><table class="dept"><thead><tr><th>Cours</th><th class="r">Discipline</th><th>Sigle</th><th class="r">Hc</th><th class="r">Hp</th><th class="r">N. Gr</th><th class="r">N. Ét</th><th class="r">PES</th><th class="r">CIM</th></tr></thead>
    <tbody>${lignes}${r.autres.map(a => `<tr class="aut"><td>${esc(a.nom)}</td><td colspan="7" class="sub">CI fixe</td><td class="r"><b>${f2(a.ci)}</b></td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="3">Facteur HP : <b>${fn(r.F)}</b></td><td class="r"><b>${fn(r.heures)}</b></td><td colspan="4" class="sub">total heures</td><td></td></tr>
